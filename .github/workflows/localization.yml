name: Localization checks
on:
  push:
    branches: [main, localization/zh-cn]
  pull_request:
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The unchanged upstream QR subprocess timeout test also fails on this runner.
      - run: cargo clean -p zte-agent
      - run: cargo test --locked -p zte-agent -- --skip web::qr_decode::tests::decodes_in_a_child_process_with_a_limit
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

