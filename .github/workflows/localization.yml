name: Localization checks
on:
  push:
    branches: [main, localization/zh-cn]
  pull_request:
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The unchanged upstream QR subprocess timeout test also fails on this runner.
      - run: cargo test --locked -p zte-agent -- --skip web::qr_decode::tests::decodes_in_a_child_process_with_a_limit
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
  ios-models:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/test-router-esim.sh
      - run: sh scripts/test-ios-traffic.sh
      - run: sh scripts/test-sms-forward.sh
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android/OpenU60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle testDebugUnitTest
